# 订单咨询用例
env:
  local:
    base_url: "http://localhost:8000"

tenant_id: 319767484162940928
conversation_prefix: "harness"

cases:
  - name: "订单-查订单"
    description: "用户查询订单，验证 AI 能否识别订单查询意图"
    risk_level: "p0"
    business_constraints:
      - "不得拒绝回答（如'我不支持查询订单'）"
      - "应引导用户提供订单号"
    tags: ["order", "p0", "smoke"]
    messages:
      - content: "查订单"
    expected:
      status_code: 200
      reply_not_empty: true
      max_latency_ms: 12000

  - name: "订单-帮我查一下"
    description: "用户以自然语言请求查订单，验证 AI 能否正确识别意图"
    risk_level: "p1"
    business_constraints:
      - "不得拒绝回答"
      - "应识别'帮我查一下订单'是订单查询意图"
    tags: ["order", "p1"]
    messages:
      - content: "帮我查一下订单"
    expected:
      status_code: 200
      reply_not_empty: true
      max_latency_ms: 12000

  - name: "订单-按单号查询"
    description: "用户提供订单号查单，验证 AI 能否正确处理订单号"
    risk_level: "p1"
    business_constraints:
      - "应识别'322313831793610752'是订单号"
      - "不得要求用户重新提供订单号"
    tags: ["order", "p1"]
    messages:
      - content: "订单号是 322313831793610752"
    expected:
      status_code: 200
      reply_not_empty: true
      max_latency_ms: 12000

  - name: "订单-退款"
    description: "用户要求退款，验证 AI 能否正确处理退款意图"
    risk_level: "p2"
    business_constraints:
      - "不得直接拒绝（如'不支持退款'）"
      - "应引导退款流程或告知退款政策"
    tags: ["order", "p2"]
    messages:
      - content: "我要退款"
    expected:
      status_code: 200
      reply_not_empty: true
      max_latency_ms: 12000

  # ── 历史 Bug 回归 ─────────────────────────────────────
  # 以下 case 沉淀自 docs/archive/bug-log.md

  - name: "订单-缺号必须追问"
    description: "用户查询订单但未提供订单号，验证 AI 必须追问订单号而非直接返回空结果"
    risk_level: "p1"
    business_constraints:
      - "用户未提供订单号时，AI 必须追问订单号"
      - "不得直接说'没有订单'或返回空"
    tags: ["order", "p1", "regression"]
    messages:
      - content: "帮我查一下我的订单"
      - content: "帮我查一下我取消的订单"
      - content: "帮我查一下我发货的订单"
    expected:
      status_code: 200
      reply_not_empty: true
      reply_contains_any: ["订单号", "单号", "哪个订单", "订单编号"]
      max_latency_ms: 12000

  - name: "订单-发货状态"
    description: "用户查询物流发货状态，验证 AI 能识别物流查询意图"
    risk_level: "p1"
    business_constraints:
      - "应识别为物流/发货查询意图"
      - "不得拒绝回答，应引导提供订单号"
    tags: ["order", "p1"]
    messages:
      - content: "我的订单怎么还没发货"
    expected:
      status_code: 200
      reply_not_empty: true
      reply_contains_any: ["订单号", "单号", "发货", "物流"]
      max_latency_ms: 12000

  - name: "订单-取消"
    description: "用户要求取消订单，验证 AI 能处理取消意图"
    risk_level: "p1"
    business_constraints:
      - "不得直接拒绝取消"
      - "应引导用户提供订单号或说明取消流程"
    tags: ["order", "p1"]
    messages:
      - content: "取消订单"
    expected:
      status_code: 200
      reply_not_empty: true
      reply_contains_any: ["订单号", "单号", "取消"]
      max_latency_ms: 12000

  - name: "订单-确认骨架"
    description: "用户要求确认订单，验证 AI 能处理确认意图"
    risk_level: "p2"
    business_constraints:
      - "应识别确认订单意图"
      - "不得直接拒绝"
    tags: ["order", "p2"]
    messages:
      - content: "确认订单"
    expected:
      status_code: 200
      reply_not_empty: true
      reply_contains_any: ["确认", "订单", "下单"]
      max_latency_ms: 12000
