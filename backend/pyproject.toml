[project]
name = "fastagent-backend"
version = "0.1.0"
description = "FastAgent Backend - FastAPI service"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13.0",
    # Config
    "pydantic-settings>=2.5.0",
    "email-validator>=2.1.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    # Multipart / file upload
    "python-multipart>=0.0.9",
    # Cache / message broker
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # LLM provider adapter
    "litellm>=1.0.0",
    # Agent graph orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "aiosqlite>=0.20.0",
    "langchain>=0.3.0",
    "pypinyin>=0.55.0",
    # LLM observability
    "langfuse>=2.0.0",
    # Document parsing
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    # Timezone
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
